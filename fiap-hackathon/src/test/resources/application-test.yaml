spring:
  application:
    name: pedido-ms-test
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  h2:
    console:
      enabled: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

queue:
  video:
    process: testVideoProcessQueue

logging:
  level:
    com.hackton.soat.videoprocessor: DEBUG
    org.springframework.amqp: DEBUG
