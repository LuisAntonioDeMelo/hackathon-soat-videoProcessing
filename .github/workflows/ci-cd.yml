name: 🚀 FIAP Hackathon CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: fiap-hackathon-backend
  FRONTEND_IMAGE_NAME: fiap-hackathon-frontend

jobs:
  # 🧪 Backend Tests
  backend-tests:
    name: 🧪 Backend Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'eclipse-temurin'
          cache: maven

      - name: 🧪 Run backend tests
        working-directory: ./fiap-hackathon
        run: ./mvnw clean test

      - name: 📊 Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: fiap-hackathon/target/surefire-reports/

  # 🧪 Frontend Tests
  frontend-tests:
    name: 🧪 Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚛️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: fiap-hackathon-frontend/package-lock.json

      - name: 📦 Install dependencies
        working-directory: ./fiap-hackathon-frontend
        run: npm ci

      - name: 🔍 Lint frontend
        working-directory: ./fiap-hackathon-frontend
        run: npm run lint

      - name: 🏗️ Build frontend
        working-directory: ./fiap-hackathon-frontend
        run: npm run build

  # 🏗️ Build Images
  build-images:
    name: 🏗️ Build Docker Images
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    if: github.event_name == 'push'
    
    permissions:
      contents: read
      packages: write

    outputs:
      backend-image: ${{ steps.backend-meta.outputs.tags }}
      frontend-image: ${{ steps.frontend-meta.outputs.tags }}
      backend-digest: ${{ steps.backend-build.outputs.digest }}
      frontend-digest: ${{ steps.frontend-build.outputs.digest }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Backend Build
      - name: 🏷️ Extract backend metadata
        id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.BACKEND_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 🏗️ Build and push backend image
        id: backend-build
        uses: docker/build-push-action@v5
        with:
          context: ./fiap-hackathon
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      # Frontend Build  
      - name: 🏷️ Extract frontend metadata
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.FRONTEND_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 🏗️ Build and push frontend image
        id: frontend-build
        uses: docker/build-push-action@v5
        with:
          context: ./fiap-hackathon-frontend
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  # 🛡️ Security Scan
  security-scan:
    name: 🛡️ Security Scan
    runs-on: ubuntu-latest
    needs: build-images
    if: github.event_name == 'push'
    
    permissions:
      contents: read
      security-events: write

    strategy:
      matrix:
        image: 
          - { name: backend, digest: "${{ needs.build-images.outputs.backend-digest }}" }
          - { name: frontend, digest: "${{ needs.build-images.outputs.frontend-digest }}" }

    steps:
      - name: 🔍 Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}/fiap-hackathon-${{ matrix.image.name }}@${{ matrix.image.digest }}
          format: 'sarif'
          output: 'trivy-results-${{ matrix.image.name }}.sarif'

      - name: 📄 Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results-${{ matrix.image.name }}.sarif'

  # 🚀 Deploy to Staging
  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-images, security-scan]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Deploy to staging
        run: |
          echo "🚀 Deploying to staging environment..."
          echo "Backend Image: ${{ needs.build-images.outputs.backend-image }}"
          echo "Frontend Image: ${{ needs.build-images.outputs.frontend-image }}"
          # Add your staging deployment logic here

  # 🎯 Deploy to Production
  deploy-production:
    name: 🎯 Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-images, security-scan]
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🎯 Deploy to production
        run: |
          echo "🎯 Deploying to production environment..."
          echo "Backend Image: ${{ needs.build-images.outputs.backend-image }}"
          echo "Frontend Image: ${{ needs.build-images.outputs.frontend-image }}"
          # Add your production deployment logic here

  # 📊 Notify
  notify:
    name: 📊 Notify Results
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always()
    
    steps:
      - name: 📊 Deployment Status
        run: |
          if [ "${{ needs.deploy-staging.result }}" == "success" ] || [ "${{ needs.deploy-production.result }}" == "success" ]; then
            echo "✅ Deployment successful!"
          else
            echo "❌ Deployment failed!"
            exit 1
          fi
